benchmark:
  name: regression_v1_fam
  img_folder: V0_NEW_Segmented-Aves-Back-224-RGBA
  dataset_dir: cross_version_1_FAM
  metric: val_mse
  folds:
  - 0
  - 1
  - 2
experiments:
  dinov3_freeze:
    model:
      backbone:
        name: dinov3_vits16
        lora: null
      head:
        type: multi_regression
        feat_dim: 384
        num_classes: 10
        dropout: 0.1
    strategy:
      type: frozen_backbone
    data:
      binarize: False
    training:
      epochs: 5
      lr: 1e-4
      batch_size: 256
    loss:
      type: KLDiv
    folds:
      0:
        status: pending
        run_dir: dinov3S_Freeze_cross_v1/fold_0
      1:
        status: pending
        run_dir: dinov3S_Freeze_cross_v1/fold_1
      2:
        status: pending
        run_dir: dinov3S_Freeze_cross_v1/fold_2

    callbacks:
    - metrics_dump
    - plotting
    - checkpoint
    - history_dump
    - inference


  dinov3_LORA:
    model:
      backbone:
        name: dinov3_vits16
        lora:
          r: 8
          alpha: 16
          dropout: 0.05
          target_modules:
          - attn.qkv
          - attn.proj
      head:
        type: multi_regression
        feat_dim: 384
        num_classes: 10
        dropout: 0.1
    strategy:
      type: LORA_backbone
    data:
      binarize: False
    training:
      epochs: 100
      lr: 1e-4
      batch_size: 64
    loss:
      type: KLDiv
    folds:
      0:
        status: pending
        run_dir: dinov3S_LORA_cross_v1/fold_0
      1:
        status: pending
        run_dir: dinov3S_LORA_cross_v1/fold_1
      2:
        status: pending
        run_dir: dinov3S_LORA_cross_v1/fold_2
