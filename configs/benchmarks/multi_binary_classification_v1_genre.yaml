benchmark:
  name: classification_v1_genre
  img_folder: V0_NEW_Segmented-Aves-Back-224-RGBA
  dataset_dir: cross_version_1_GENRE
  metric: val_auc
  folds:
  - 0
  - 1
  - 2
experiments:
  dinov3_freeze:
    model:
      backbone:
        name: dinov3_vits16
        lora: null
      head:
        type: multi_binary
        feat_dim: 384
        num_classes: 10
        dropout: 0.1
    strategy:
      type: frozen_backbone
    data:
      binarize: true
    training:
      epochs: 100
      lr: 1e-4
      batch_size: 64
    loss:
      type: bce_weighted
    folds:
      0:
        status: done
        run_dir: dinov3S_Freeze_cross_v1/fold_0
      1:
        status: done
        run_dir: dinov3S_Freeze_cross_v1/fold_1
      2:
        status: done
        run_dir: dinov3S_Freeze_cross_v1/fold_2

  dinov3_LORA:
    model:
      backbone:
        name: dinov3_vits16
        lora:
          r: 8
          alpha: 16
          dropout: 0.05
          target_modules:
          - attn.qkv
          - attn.proj
      head:
        type: multi_binary
        feat_dim: 384
        num_classes: 10
        dropout: 0.1
    strategy:
      type: LORA_backbone
    data:
      binarize: true
    training:
      epochs: 100
      lr: 1e-4
      batch_size: 64
    loss:
      type: bce_weighted
    folds:
      0:
        status: done
        run_dir: dinov3S_LORA_cross_v1/fold_0
      1:
        status: done
        run_dir: dinov3S_LORA_cross_v1/fold_1
      2:
        status: done
        run_dir: dinov3S_LORA_cross_v1/fold_2

  dinov3_LORA_L:
    model:
      backbone:
        name: dinov3_vitl16
        lora:
          r: 8
          alpha: 16
          dropout: 0.05
          target_modules:
          - attn.qkv
          - attn.proj
      head:
        type: multi_binary
        feat_dim: 1024
        num_classes: 10
        dropout: 0.1
    strategy:
      type: LORA_backbone
    data:
      binarize: true
    training:
      epochs: 5
      lr: 1e-4
      batch_size: 64
    loss:
      type: bce_weighted
    folds:
      0:
        status: pending
        run_dir: dinov3L_LORA_cross_v1/fold_0
      1:
        status: pending
        run_dir: dinov3L_LORA_cross_v1/fold_1
      2:
        status: pending
        run_dir: dinov3L_LORA_cross_v1/fold_2

  dinov3_LORA_ASL:
    model:
      backbone:
        name: dinov3_vits16
        lora:
          r: 8
          alpha: 16
          dropout: 0.05
          target_modules:
          - attn.qkv
          - attn.proj
      head:
        type: multi_binary
        feat_dim: 384
        num_classes: 10
        dropout: 0.1
    strategy:
      type: LORA_backbone
    data:
      binarize: true
    training:
      epochs: 100
      lr: 1e-4
      batch_size: 64
    loss:
      type: asl
    folds:
      0:
        status: done
        run_dir: dinov3S_LORA_cross_v1/fold_0
      1:
        status: done
        run_dir: dinov3S_LORA_cross_v1/fold_1
      2:
        status: done
        run_dir: dinov3S_LORA_cross_v1/fold_2